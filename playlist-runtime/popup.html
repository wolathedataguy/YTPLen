<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Playlist Runtime</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="top">
      <div class="heading">
        <h1 id="title">Playlist Runtime</h1>
        <p id="meta" class="meta"></p>
      </div>
      <button id="refresh" class="icon-btn" type="button" title="Recount this playlist" aria-label="Recount this playlist" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <section id="status" class="status" aria-live="polite">
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <p id="statusTitle" class="status-title">Counting videos…</p>
      <p id="statusBody" class="status-body"></p>
    </section>

    <section id="result" hidden>
      <div class="total">
        <span id="totalLabel" class="total-label">Full length</span>
        <span id="total" class="total-time"></span>
        <span id="totalHours" class="total-hours"></span>
      </div>

      <div class="dial">
        <output id="speedTime" class="speed-time" for="speedInput speedRange" aria-live="polite"></output>
        <p id="speedSub" class="speed-sub"></p>
        <div class="speed-controls">
          <input id="speedRange" type="range" min="0.25" max="4" step="0.05" aria-label="Playback speed slider">
          <label class="speed-box">
            <input id="speedInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Playback speed">
            <span aria-hidden="true">×</span>
          </label>
        </div>
      </div>

      <div id="ladder" class="ladder" role="group" aria-label="Common speeds"></div>

      <div class="span-row">
        <span>Count videos</span>
        <input id="from" type="number" min="1" step="1" aria-label="First video to count">
        <span>to</span>
        <input id="to" type="number" min="1" step="1" aria-label="Last video to count">
        <button id="all" class="text-btn" type="button" hidden>All</button>
      </div>

      <div id="notes" class="notes"></div>
    </section>
  </main>
  <script src="collector.js"></script>
  <script src="popup.js"></script>
</body>
</html>
